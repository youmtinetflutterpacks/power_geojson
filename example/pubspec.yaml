name: power_geojson_example
description: Demonstrates how to use the power_geojson plugin.

publish_to: "none"

environment:
    sdk: ^3.11.0
    flutter: ">=2.18.0"

dependencies:
    flutter:
        sdk: flutter
    power_geojson:
        path: ../

    collection: ^1.19.1
    console_tools: ^2.0.3
    cupertino_icons: ^1.0.8
    enhanced_future_builder: ^2.0.0
    flutter_map: ^8.2.2
    flutter_svg: ^2.2.3
    file_picker: ^10.3.10
    get: ^4.7.3
    google_fonts: ^8.0.2
    shared_preferences: ^2.5.4
    uuid: ^4.5.3
    http: ^1.6.0
    latlong2: ^0.9.1
    proj4dart: ^2.1.0
    wakelock_plus: ^1.4.0
    dio: ^5.9.1
    image_picker: ^1.2.1
    mime: ^2.0.0
    path_provider: ^2.1.5
    flutter_map_marker_cluster: ^8.2.2
    flutter_map_marker_popup: ^8.1.0

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^2.0.0
    flutter_launcher_icons: ^0.14.4
    flutter_native_splash: ^2.4.7

flutter:
    uses-material-design: true

    assets:
        - assets/
        - assets/file/
        - assets/icons/
